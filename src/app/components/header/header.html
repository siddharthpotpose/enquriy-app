<!-- Header/Navbar Component -->
<header class="navbar" [class.logged-in]="isLoggedIn()" [class.logged-out]="!isLoggedIn()">
  <div class="navbar-container">
    <!-- Logo -->
    <a href="#" class="navbar-logo">
      <span class="logo-icon">◆</span>
      <span class="logo-text">EnquiryApp</span>
    </a>

    <!-- Navigation Links -->
    <nav>
      <ul class="navbar-menu" [class.active]="isMobileMenuOpen" id="navbarMenu">


        @if(isLoggedIn()){
        <li class="nav-item">
          <a routerLink="dashboard" class="nav-link" [class.active]="currentRoute === 'dashboard'"
            (click)="setRoute('dashboard')">Dashboard</a>
        </li>
        <li class="nav-item">
          <a routerLink="enquirydetails" class="nav-link" [class.active]="currentRoute === 'enquirydetails'"
            (click)="setRoute('enquirydetails')">Enquiry Details</a>
        </li>
        <li class="nav-item">
          <a routerLink="category" class="nav-link" [class.active]="currentRoute === 'categories'"
            (click)="setRoute('categories')">Categories</a>
        </li>
        }@else {
        <li class="nav-item">
          <a routerLink="home" fragment="home" class="nav-link" [class.active]="currentRoute === 'home'"
            (click)="setRoute('home')">Home</a>
        </li>
        <li class="nav-item">
          <a routerLink="home" fragment="features" class="nav-link" [class.active]="currentRoute === 'features'"
            (click)="scrollToSection('features')">Features</a>
        </li>
        <li class="nav-item">
          <a routerLink="home" fragment="process" class="nav-link" [class.active]="currentRoute === 'process'"
            (click)="scrollToSection('process')">Process</a>
        </li>
        }


        <!-- <li class="nav-item">
          <a routerLink="submitenquiry" class="nav-link" [class.active]="currentRoute === 'submitenquiry'"
            (click)="setRoute('submitenquiry')">Get Started</a>
        </li> -->

        <!-- <li class="nav-item">
          <a routerLink="home" class="nav-link" [class.active]="currentRoute === 'status'"
            (click)="setRoute('status')">Status</a>
        </li> -->
      </ul>
    </nav>

    <!-- Right Side - Auth Section -->
    <div class="navbar-auth" [class.active]="isMobileMenuOpen" id="navbarAuth">
      <!-- Logged Out State -->


      @if(!isLoggedIn()){
      <button class="get-started-btn" routerLink="submitenquiry">
        <!-- <span class="btn-icon">👤</span> -->
        <i class="fas fa-rocket me-2"></i>
        <span class="btn-text">Get Started</span>
      </button>

      <div class="auth-section logged-out">
        <button class="login-btn" routerLink="login">
          <span class="btn-icon">👤</span>
          <span class="btn-text">Login</span>
        </button>
      </div>


      }@else{
      <!-- Logged In State -->
      <div class="auth-section logged-in">
        <div class="user-info">
          <span class="user-avatar">👤</span>
          <span class="user-name">Welcome - {{ userName() }}</span>
        </div>
        <button class="logout-btn" (click)="logOut()">
          <span class="btn-icon">🚪</span>
          <span class="btn-text">Logout</span>
        </button>
      </div>
      }
    </div>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-btn" [class.active]="isMobileMenuOpen" (click)="toggleMobileMenu()"
      aria-label="Toggle menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>
</header>
